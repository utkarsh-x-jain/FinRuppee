<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinRuppee – Choose Plan</title>
  <link rel="stylesheet" href="/CSS/choose.css">
  <link rel="icon" href="/Images/favicon-img.png">
</head>
<body>

  <div class="container">
    <h1 class="heading">Choose Your Plan</h1>
    <div class="plans">
      <div class="card active-card">
        <h2>Starter</h2>
        <p class="price">₹0 setup</p>
        <ul>
          <li>UPI & Wallets</li>
          <li>Basic reports</li>
          <li>Email support</li>
        </ul>
        <button class="btn">Choose</button>
      </div>

      <div class="card">
        <h2>Scale</h2>
        <p class="price">₹99 / month</p>
        <ul>
          <li>Cards + UPI</li>
          <li>Auto settlements</li>
          <li>Priority support</li>
        </ul>
        <button class="btn">Choose</button>
      </div>

      <div class="card">
        <h2>Enterprise</h2>
        <p class="price">Custom</p>
        <ul>
          <li>Dedicated account manager</li>
          <li>Custom SLAs</li>
          <li>Integration assistance</li>
        </ul>
        <button class="btn">Choose</button>
      </div>
    </div>
  </div>

<script src="/JS/script.js"></script>
</body>
</html>
