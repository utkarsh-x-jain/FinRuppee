<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinRuppee - Payment</title>
  <link rel="stylesheet" href="/CSS/payment.css">
  <link rel="icon" href="/Images/favicon-img.png">
</head>
<body>

  <div class="box">
    <h2>Plan Summary</h2>

    <div class="info">
      <p><strong>Selected Plan:</strong> <span id="planDisplay">Premium</span></p>
      <p><strong>Price:</strong> <span id="priceDisplay">₹299 / month</span></p>
      <p><strong>Features:</strong></p>
      <ul>
        <li>Unlimited expense tracking</li>
        <li>Full financial analytics</li>
        <li>Priority customer support</li>
        <li>Secure cloud backup</li>
      </ul>
    </div>

    <h2>Payment Details</h2>

    <form id="pay-form">
      <label>Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label>Email Address</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>

      <label>Card Number</label>
      <input type="text" id="card-number" name="card" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" required>

      <label>Expiry Date</label>
      <input type="month" id="expiry" name="expiry" required>

      <label>CVV</label>
      <div class="password-wrap">
        <input type="password" id="cvv" name="cvv" maxlength="3" placeholder="***" required>
        <span id="showCVV" class="show-pass">👁️</span>
      </div>

      <button class="btn" id="pay-btn" type="submit">Pay Now</button>
    </form>

  </div>

<script src="/JS/script.js"></script>

</body>
</html>
