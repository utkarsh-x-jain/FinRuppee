<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinRuppee – Payment</title>
  <link rel="stylesheet" href="/CSS/payment.css">
  <link rel="icon" href="favicon-img.png">
</head>
<body>

  <div class="box">

    <h2>Plan Summary</h2>

    <div class="info">
      <p><strong>Selected Plan:</strong> Premium Plan</p>
      <p><strong>Price:</strong> ₹299 / month</p>
      <p><strong>Features:</strong></p>
      <ul>
        <li>Unlimited expense tracking</li>
        <li>Full financial analytics</li>
        <li>Priority customer support</li>
        <li>Secure cloud backup</li>
      </ul>
    </div>

    <h2>Payment Details</h2>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Your name" required>

      <label>Email Address</label>
      <input type="email" placeholder="Your email" required>

      <label>Card Number</label>
      <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" required>

      <label>Expiry Date</label>
      <input type="month" required>

      <label>CVV</label>
      <input type="password" placeholder="***" required>

      <button class="btn">Pay Now</button>
    </form>

  </div>

</body>
</html>
